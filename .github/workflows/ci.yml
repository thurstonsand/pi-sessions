name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up mise
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: mise run check

      - name: Smoke test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux

      - name: Real Pi smoke test
        run: mise run smoke

      - name: Smoke artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pi-smoke
          path: .mise/smoke/
          include-hidden-files: true
          if-no-files-found: ignore
