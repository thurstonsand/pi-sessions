name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

# Release calls this workflow, so the group needs its own prefix: `github.workflow` there names the
# caller, and sharing the caller's group deadlocks. Pushes to main are never cancelled, since pi
# installs from main and every commit there needs its own result.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: mise run check

      - name: Smoke test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux

      - name: Real Pi smoke test
        run: mise run smoke

      - name: Smoke artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pi-smoke
          path: .mise/smoke/
          include-hidden-files: true
          if-no-files-found: ignore

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      # System temp is on C:, where SQLite journal flushes stall under concurrent tests.
      - name: Use runner temporary drive
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: node
          cache: true

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: mise run test

      - name: Real Herdr smoke test
        run: mise run smoke:herdr
