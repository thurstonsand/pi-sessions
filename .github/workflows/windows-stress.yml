name: Windows stress

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Revision to test
        required: true
        default: main
      repetitions:
        description: Full suite repetitions per runner
        required: true
        default: "10"

permissions:
  contents: read

jobs:
  test:
    name: Windows (${{ matrix.temp }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        temp: [system, runner]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Set up mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: node
          cache: true

      - name: Install dependencies
        run: npm ci

      - name: Compare SQLite commit latency
        run: |
          @'
          const { DatabaseSync } = require('node:sqlite');
          const { mkdtempSync, rmSync } = require('node:fs');
          const { join } = require('node:path');
          for (const root of [require('node:os').tmpdir(), process.env.RUNNER_TEMP]) {
            const dir = mkdtempSync(join(root, 'sqlite-probe-'));
            const db = new DatabaseSync(join(dir, 'index.sqlite'));
            db.exec('PRAGMA synchronous = NORMAL; CREATE TABLE probe (value INTEGER)');
            const times = [];
            for (let i = 0; i < 100; i++) {
              const start = performance.now();
              db.exec('INSERT INTO probe VALUES (1)');
              times.push(performance.now() - start);
            }
            times.sort((a, b) => a - b);
            console.log(JSON.stringify({ root, medianMs: times[50], p95Ms: times[95], maxMs: times[99] }));
            db.close();
            rmSync(dir, { recursive: true });
          }
          '@ | node

      - name: Build broker
        run: mise run build:broker

      - name: Repeat full suite
        env:
          REPETITIONS: ${{ inputs.repetitions }}
          TEST_TEMP: ${{ matrix.temp }}
        run: |
          if ($env:TEST_TEMP -eq 'runner') {
            $env:TEMP = $env:RUNNER_TEMP
            $env:TMP = $env:RUNNER_TEMP
          }
          New-Item -ItemType Directory -Force .vitest | Out-Null
          $failures = 0
          for ($i = 1; $i -le [int]$env:REPETITIONS; $i++) {
            Write-Output "::group::Full suite $i"
            npx vitest run --reporter=default --reporter=json --outputFile=".vitest/run-$i.json"
            if ($LASTEXITCODE -ne 0) { $failures++ }
            Write-Output '::endgroup::'
          }
          Write-Output "$failures failing runs of $env:REPETITIONS"
          if ($failures -ne 0) { exit 1 }

      - name: Test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-${{ matrix.temp }}
          path: .vitest/
          include-hidden-files: true
