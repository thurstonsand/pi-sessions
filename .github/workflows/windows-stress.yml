name: Windows stress

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Revision to test
        required: true
        default: main
      repetitions:
        description: Full suite repetitions per runner
        required: true
        default: "10"

permissions:
  contents: read

jobs:
  test:
    name: Windows (${{ matrix.sample }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Set up mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: node
          cache: true

      # After mise setup: mise-action renames its download from TEMP into C:, which fails across drives.
      - name: Use runner temporary drive
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV

      - name: Install dependencies
        run: npm ci

      - name: Build broker
        run: mise run build:broker

      - name: Repeat full suite
        env:
          REPETITIONS: ${{ inputs.repetitions }}
        run: |
          $repetitions = [int]$env:REPETITIONS
          if ($repetitions -lt 1 -or $repetitions -gt 30) {
            throw 'Repetitions must be between 1 and 30'
          }
          New-Item -ItemType Directory -Force .vitest | Out-Null
          $failures = 0
          for ($i = 1; $i -le $repetitions; $i++) {
            Write-Output "::group::Full suite $i"
            npx vitest run --reporter=default --reporter=json --outputFile=".vitest/run-$i.json"
            if ($LASTEXITCODE -ne 0) { $failures++ }
            Write-Output '::endgroup::'
          }
          Write-Output "$failures failing runs of $repetitions"
          if ($failures -ne 0) { exit 1 }

      - name: Test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-${{ matrix.sample }}
          path: .vitest/
          include-hidden-files: true
