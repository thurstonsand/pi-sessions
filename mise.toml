min_version = "2026.10.4"

[settings]
experimental = true

[hooks]
enter = "mise bootstrap --yes --quiet"

[tools]
hk = "2.11.1"
# hk's check and fix hooks run jactionlint, which runs shellcheck over every `run:` script
"aqua:jdx/jactionlint" = "2.5.0"
node = "26"
shellcheck = "0.11.0"

[env]
HK_MISE = "1"
_.path = ["{{config_root}}/node_modules/.bin"]

[tasks.bootstrap]
description = "Install project dependencies and git hooks"
run = [
    "npm ci --quiet --no-fund --no-audit",
    # pi must always resolve to the global install, never this repo's copy
    "rm -f node_modules/.bin/pi",
    "hk install --mise --quiet",
]
sources = ["mise.toml", "hk.pkl", "package.json", "package-lock.json"]
# npm ci rewrites this on every install, so deleting node_modules also retriggers bootstrap
outputs = ["node_modules/.package-lock.json"]
quiet = true

[tasks."build:broker"]
description = "Compile the detached messaging broker into dist/"
run = "tsc --project tsconfig.broker.json"

[tasks.lint]
description = "Lint"
depends = ["lint:*"]

[tasks."lint:biome"]
description = "Lint TypeScript, JSON and Markdown"
run = "biome check ."

[tasks."lint:actions"]
description = "Lint GitHub Actions workflows"
run = "hk check --all --step jactionlint"

[tasks."lint:changelog"]
description = "Verify CHANGELOG.md's headings and that its newest release is package.json's version"
run = "node scripts/check-changelog.ts"

# `npm ci` installs what the lockfile says without re-resolving it, so a lockfile npm can no longer
# resolve still passes CI; Renovate and bootstrap run the resolver and would hit ERESOLVE.
[tasks."lint:lockfile"]
description = "Verify npm still resolves package.json to the committed lockfile"
run = [
  "npm install --package-lock-only --ignore-scripts --no-audit --no-fund",
  "git diff --exit-code package-lock.json",
]

[tasks."lint:broker"]
description = "Verify the committed broker build matches its source"
depends = ["build:broker"]
run = "git diff --exit-code -- dist"

# Renovate's tasks run under MISE_ENV=renovate, whose mise.renovate.toml overlays Renovate and the
# Node it supports, so its install stays out of every bootstrap and mise both installs and runs it
# on that Node: re2, Renovate's native regex engine, is built for the Node that installs it and
# refuses to load in another, leaving validation on JavaScript RegExp with only a warning. `mise x`
# also puts that Node ahead of a Homebrew one already on PATH.
[tasks.renovate]
description = "Run Renovate"
run = "MISE_ENV=renovate mise x -- renovate"

[tasks."lint:renovate"]
description = "Validate Renovate configuration"
run = "MISE_ENV=renovate mise x -- renovate-config-validator renovate.json"

[tasks.release]
description = "Release X.Y.Z from a green main: date the Unreleased changelog section, set the version, commit, tag and push"
usage = 'arg "<version>" help="The version to release, as X.Y.Z"'
run = 'scripts/release.sh "${usage_version}"'

[tasks.format]
description = "Format and apply safe fixes"
run = ["biome check --write .", "hk fix --all --step jactionlint"]

[tasks.typecheck]
description = "Type-check TypeScript"
run = "tsc --noEmit"

[tasks.test]
description = "Run tests"
depends = ["build:broker"]
run = "vitest run"

[tasks.smoke]
description = "Exercise real Pi, tmux and Herdr with disposable state and a scripted provider"
depends = ["build:broker", "smoke:herdr"]
run = "PATH=\"{{ tools.node.path }}/bin:$PATH\" vitest run --config vitest.smoke.config.ts test/smoke/pi.smoke.ts"

[tasks."smoke:herdr"]
description = "Drive a real headless Herdr server through the worker runtime"
run = "vitest run --config vitest.smoke.config.ts test/smoke/herdr.smoke.ts"
tools."github:herdrdev/herdr" = "0.9.5"

# Node 26 only strips types, and the extension code uses parameter properties, so the benchmark
# loads it through jiti, the loader Pi itself runs extensions with.
[tasks.bench]
description = "Benchmark reindex, search and incremental hooks without writing live state"
run = "PATH=\"{{ tools.node.path }}/bin:$PATH\" jiti scripts/benchmark.ts"

[tasks.check]
description = "Run full verification"
depends = ["lint", "typecheck", "test"]
